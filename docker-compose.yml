name: teamspace

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamspace_app}
      POSTGRES_USER: ${POSTGRES_USER:-teamspace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamspace_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamspace_user -d teamspace_app']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
    ports:
      - '${BACKEND_PORT:-8000}:8000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  postgres_data:
